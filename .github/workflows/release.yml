# Builds Spaceherd for macOS and Linux. A version tag (v0.2.0) also publishes
# a GitHub Release with the files and the update feeds (latest-*.yml).
# Started by hand from the Actions tab, it only builds and keeps the files as
# workflow artifacts.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            args: --mac
          - name: linux-x64
            os: ubuntu-24.04
            args: --linux --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            args: --linux --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # electron-builder's bundled fpm (used for .deb) is x64 only.
      - name: Install fpm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      # On Linux this also compiles node-pty, which has no Linux prebuilds.
      - run: npm ci

      - run: npm run dist -- ${{ matrix.args }}

      # The in-app updater only installs files signed with this key (see
      # src/main/update-signature.js). Required for releases; builds started
      # by hand without the secret skip it.
      - name: Sign update files
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            node scripts/sign-update.js dist
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "The UPDATE_SIGNING_KEY secret is required for releases" >&2
            exit 1
          else
            echo "UPDATE_SIGNING_KEY not set; update files are not signed"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: spaceherd-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.sig
            dist/latest*.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Spaceherd ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
